<!doctype html>
<html>

<head>

</head>
<body>
  <main class="maincontents">

我の心が折れるからな。</h2>
    <h3 class="heading-ng">登録されているNGワード</h3>

      <form class="form-ngwords">
        <div class="form-parts-wrap">

        </div>
        <div class="form-submitbtn-wrap">
          <input type="submit" value="魔王に献上する" class="form-submitbtn">
        </div>
          </form>
